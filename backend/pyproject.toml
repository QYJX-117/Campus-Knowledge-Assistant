[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "campus-qa-backend"
version = "2.0.0"
description = "Campus knowledge Q&A assistant API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "email-validator>=2.2.0,<3",
  "uvicorn[standard]>=0.34.0,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.0.0,<6",
  "pymupdf>=1.26.0,<2",
  "rapidocr-onnxruntime>=1.4.4,<2",
  "python-docx>=1.1.2,<2",
  "python-dotenv>=1.0.1,<2",
  "httpx>=0.28.0,<1",
  "dashscope>=1.20.0",
  "faiss-cpu>=1.9.0",
  "numpy>=1.26.0",
  "llama-index>=0.12.0",
  "llama-index-embeddings-dashscope>=0.3.0",
  "llama-index-llms-dashscope>=0.3.0",
  "llama-index-vector-stores-faiss>=0.3.0",
  "sentence-transformers>=3.0.0",
  "rank-bm25>=0.2.2",
  "jieba>=0.42.1",
  "loguru>=0.7.0",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-cov>=6.0.0,<7",
  "httpx>=0.28.0,<1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
